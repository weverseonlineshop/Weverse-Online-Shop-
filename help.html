  <style>*{font-family:'Inter',system-ui,sans-serif}.glass{background:rgba(15,23,42,.75);backdrop-filter:blur(20px)}@keyframes fade-in-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.fade-in-up{animation:fade-in-up .8s ease forwards}@keyframes slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.slide-up{animation:slide-up .5s ease forwards}.faq-answer{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease,padding .3s ease;opacity:0}.faq-answer.open{max-height:500px;opacity:1;padding-top:12px;padding-bottom:12px}.faq-icon{transition:transform .3s ease}.faq-icon.open{transform:rotate(180deg)}</style>
</head>
<body class="bg-[#070b16] text-gray-100 min-h-screen">
  <div class="fixed inset-0 pointer-events-none"><div class="absolute inset-0 bg-gradient-to-br from-[#070b16] via-[#0a1124] to-[#070b16]"></div><div class="absolute -top-48 -left-48 w-[32rem] h-[32rem] bg-blue-600/10 rounded-full blur-3xl"></div></div>
  <header class="fixed top-0 inset-x-0 z-40 glass border-b border-blue-500/15">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2"><div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-blue-800 rounded-lg flex items-center justify-center"><i data-lucide="globe" class="w-5 h-5 text-white"></i></div><div><span class="text-lg font-black text-white block leading-tight">K.C.O</span><span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Global Online Marketplace</span></div></a>
      <a href="/" class="text-xs text-gray-400 hover:text-white transition flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home</a>
    </div>
  </header>
  <main class="pt-16 max-w-4xl mx-auto px-4 sm:px-6 py-12 relative z-10">
    <div class="text-center mb-12 fade-in-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-500/10 rounded-2xl mb-4"><i data-lucide="help-circle" class="w-8 h-8 text-blue-400"></i></div>
      <h1 class="text-3xl sm:text-4xl font-black text-white mb-3">Help Center</h1>
      <p class="text-gray-500 text-lg">Find answers to common questions and get the support you need.</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <a href="/contact.html" class="glass border border-blue-500/20 rounded-2xl p-5 text-center slide-up hover:border-blue-500/40 transition"><div class="inline-flex items-center justify-center w-12 h-12 bg-blue-500/10 rounded-xl mb-3"><i data-lucide="mail" class="w-6 h-6 text-blue-400"></i></div><h3 class="text-sm font-bold text-white uppercase tracking-wide mb-1">Contact Form</h3><p class="text-xs text-gray-500">Send us a message</p></a>
      <a href="mailto:support@kcoglobalonlinemarket.com" class="glass border border-blue-500/20 rounded-2xl p-5 text-center slide-up hover:border-blue-500/40 transition" style="animation-delay:.1s"><div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-500/10 rounded-xl mb-3"><i data-lucide="at-sign" class="w-6 h-6 text-emerald-400"></i></div><h3 class="text-sm font-bold text-white uppercase tracking-wide mb-1">Email Support</h3><p class="text-xs text-gray-500">24/7 response</p></a>
      <div class="glass border border-blue-500/20 rounded-2xl p-5 text-center slide-up" style="animation-delay:.2s"><div class="inline-flex items-center justify-center w-12 h-12 bg-amber-500/10 rounded-xl mb-3"><i data-lucide="message-circle" class="w-6 h-6 text-amber-400"></i></div><h3 class="text-sm font-bold text-white uppercase tracking-wide mb-1">Live Chat</h3><p class="text-xs text-gray-600">Coming Soon</p></div>
    </div>
    <div class="glass border border-blue-500/20 rounded-2xl p-6 sm:p-8 slide-up">
      <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="message-square" class="w-5 h-5 text-blue-400"></i> Frequently Asked Questions</h2>
      <div class="space-y-3" id="faq-list"></div>
    </div>
  </main>
  <footer class="border-t border-blue-500/10 mt-12 py-8 text-center text-xs text-gray-600">© K.C.O Global Online Marketplace. All rights reserved.</footer>
  <script type="module">
    const FAQS = [
      { q: "How do I create an account?", a: "Click the Sign In button at the top of any page, then switch to the Register tab. Enter your email, password, username, and country. A verification email will be sent to your email address — click the link to activate your account." },
      { q: "How do I track my order?", a: "Log in to your account and go to the Order Tracking section. You'll see the current status of each order, the courier name, tracking number, and estimated delivery date. You can also click the tracking link to track your package on the courier's website." },
      { q: "What payment methods do you accept?", a: "We accept card payments, bank transfers, USSD, and mobile money through Flutterwave. We also support manual bank transfer with receipt verification for customers who prefer direct deposits. We support 9 currencies including USD, GBP, EUR, CAD, AUD, SGD, JPY, MXN, and IDR." },
      { q: "How long does payment verification take?", a: "Flutterwave payments are verified instantly. Manual bank transfer receipts are typically verified within a few minutes up to 24 hours. You'll receive an email notification once your payment is approved." },
      { q: "What if my payment is rejected?", a: "If your payment cannot be verified, you'll receive a Payment Rejected email explaining the reason. You can upload a new receipt from your account dashboard or contact support for assistance." },
      { q: "How long does shipping take?", a: "Standard shipping takes 3-7 business days, Express takes 2-4 business days, and Priority takes 1-2 business days. International orders may take longer due to customs clearance. You'll receive shipping updates by email at each stage of delivery." },
      { q: "Which countries do you ship to?", a: "We ship to over 200 countries worldwide via DHL, FedEx, UPS, and EMS. Shipping methods and delivery times may vary by location. Customs duties and import taxes are the responsibility of the buyer." },
      { q: "How do I request a refund?", a: "To request a refund, email us at support@kcoglobalonlinemarket.com with your order number and reason for the refund. Refunds are available for cancelled orders, damaged products, and non-delivery. See our Refund Policy page for full details." },
      { q: "How do I change my password?", a: "Log in to your account, go to the Profile section, and enter your new password. If you've forgotten your password, click the Forgot Password link on the login page and we'll send you a reset link by email." },
      { q: "Is my payment information secure?", a: "Yes. All transactions are processed over SSL-encrypted connections. Payment data is handled by certified payment gateways and is never stored in plain text on our servers. We use industry-standard security measures to protect your data." },
      { q: "How do I download my payment receipt?", a: "Log in to your account and go to the My Orders section. Click on any order to view details and download your payment receipt." },
      { q: "What if I have a problem with my order?", a: "Contact us at support@kcoglobalonlinemarket.com or use our Contact Form. Our 24/7 support team will help resolve any issues with your order, payment, or delivery." },
    ];
    const list = document.getElementById('faq-list');
    list.innerHTML = FAQS.map((f, i) => `
      <div class="border border-blue-500/15 rounded-xl overflow-hidden">
        <button onclick="toggleFaq(${i})" class="w-full flex items-center justify-between p-4 text-left hover:bg-blue-500/5 transition">
          <span class="text-sm font-bold text-white pr-3">${f.q}</span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-blue-400 shrink-0 faq-icon" id="faq-icon-${i}"></i>
        </button>
        <div class="faq-answer px-4 text-sm text-gray-400 leading-relaxed" id="faq-answer-${i}">${f.a}</div>
      </div>
    `).join('');
    window.toggleFaq = (i) => {
      const ans = document.getElementById('faq-answer-' + i);
      const icon = document.getElementById('faq-icon-' + i);
      ans.classList.toggle('open');
      icon.classList.toggle('open');
    };
    lucide.createIcons();
  </script>
  <script type="module" src="/src/localization-bootstrap.js"></script>
  <script type="module" src="/src/live-stream-mode.js"></script>
  <script type="module" src="/src/customer-ai-widget.js"></script>
  <script src="/back-button.js" defer></script>
</body>
</html>
