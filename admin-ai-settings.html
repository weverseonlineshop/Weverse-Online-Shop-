<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Settings | K.C.O Global Online Marketplace</title>
  <meta name="description" content="Configure AI assistant settings for K.C.O Global Online Marketplace.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K.C.O Global">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="K.C.O Global Online Marketplace">
  <meta property="og:title" content="AI Settings | K.C.O Global Online Marketplace">
  <meta property="og:description" content="Configure AI assistant settings for K.C.O Global Online Marketplace.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="AI Settings | K.C.O Global Online Marketplace">
  <meta name="twitter:description" content="Configure AI assistant settings for K.C.O Global Online Marketplace.">
  <link rel="canonical" href="https://k-c-o-global-online-4kft.bolt.host/admin-ai-settings">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0" defer></script>
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { -webkit-font-smoothing: antialiased; }
    .glass { background: rgba(15,23,42,.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fade-in .4s ease forwards; }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .slide-up { animation: slide-up .5s cubic-bezier(.16,1,.3,1) forwards; }
    .btn-press { transition: transform .15s cubic-bezier(.4,0,.2,1); }
    .btn-press:active { transform: scale(.97); }
    .provider-card { transition: all .2s ease; cursor: pointer; }
    .provider-card.active { border-color: rgba(59,130,246,.5); background: rgba(59,130,246,.08); }
    .provider-card:hover { border-color: rgba(59,130,246,.3); }
    .input-field { transition: border-color .2s, box-shadow .2s; }
    .input-field:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  </style>
</head>
<body class="bg-[#070b16] text-gray-100 min-h-screen">
  <div class="fixed inset-0 pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-br from-[#070b16] via-[#0a1124] to-[#070b16]"></div>
    <div class="absolute -top-48 -left-48 w-[32rem] h-[32rem] bg-blue-600/10 rounded-full blur-3xl"></div>
  </div>

  <header class="fixed top-0 inset-x-0 z-40 glass border-b border-blue-500/15">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 via-blue-600 to-blue-800 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/30">
          <i data-lucide="settings" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="text-lg font-black tracking-tight text-white block leading-tight">AI Settings</span>
          <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">K.C.O Global Online Marketplace</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/admin-ai.html" class="btn-press flex items-center gap-1.5 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/30">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span class="hidden sm:inline">AI Assistant</span>
        </a>
        <a href="/" class="btn-press flex items-center gap-1.5 text-xs font-bold text-gray-400 hover:text-white bg-blue-950/60 border border-blue-500/20 px-3 py-2 rounded-xl transition">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Home</span>
        </a>
      </div>
    </div>
  </header>

  <main class="pt-16 max-w-3xl mx-auto px-4 sm:px-6 py-8 relative z-10">
    <div id="settings-root" class="space-y-6">
      <div class="flex items-center justify-center py-20">
        <div class="flex items-center gap-3 text-gray-500 text-sm">
          <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-blue-400"></i>
          Loading settings...
        </div>
      </div>
    </div>
  </main>

  <div id="access-denied" class="hidden fixed inset-0 z-50 bg-[#070b16] flex items-center justify-center p-6">
    <div class="glass border border-red-500/20 rounded-2xl p-8 max-w-md w-full text-center slide-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-red-500/10 rounded-2xl mb-4">
        <i data-lucide="lock" class="w-8 h-8 text-red-400"></i>
      </div>
      <h2 class="text-xl font-bold text-white mb-2">Admin Access Required</h2>
      <p class="text-sm text-gray-400 mb-6">You need admin privileges to access AI Settings.</p>
      <a href="/auth.html?redirect=/admin-ai-settings.html" class="btn-press inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-6 rounded-xl text-sm uppercase tracking-wide transition shadow-lg shadow-blue-600/30">
        <i data-lucide="log-in" class="w-4 h-4"></i> Sign In
      </a>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-[100] transform translate-y-20 opacity-0 bg-gray-900 border border-blue-500/30 text-white px-5 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 font-medium transition-all duration-300 pointer-events-none">
    <i data-lucide="info" class="w-4 h-4 text-blue-400"></i><span id="toast-msg">Action</span>
  </div>

  <script type="module" src="/src/localization-bootstrap.js"></script>
  <script type="module" src="/src/live-stream-mode.js"></script>
  <script type="module" src="/src/admin-ai-settings-page.js"></script>
  <script src="/back-button.js" defer></script>
</body>
</html>
